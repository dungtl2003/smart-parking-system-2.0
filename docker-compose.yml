services:
  postgres:
    image: postgres:15
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data
    networks:
      - sps-group
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - sps-group

  sps-express-server:
    build:
      context: ./express-server
      dockerfile: Dockerfile
    image: sps-express-server:latest
    container_name: sps-express-server-container
    restart: always
    init: true
    environment:
      DATABASE_URL: postgres://user:user@postgres:5432/mydb
      AT_SECRET_KEY: rfe82EiW1K4m7Wr1PMlZgfALvuErwjeh
      RT_SECRET_KEY: WMZpn95CCxpXyGquRNuexoCWsDmVt7kt
      PORT: 4000
      NODE_ENV: development
      CLIENT_DOMAIN_1: http://127.0.0.1:3000
      CAMERA_SERVER_API: https://leading-huge-jackal.ngrok-free.app/api/v1/validate-car-plate
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sps-group

  sps-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_VERSION: /api/v1
        VITE_API_SERVER_PORT: 4000
        VITE_EXPRESS_SERVER_API: http://127.0.0.1
    image: sps-frontend:latest
    container_name: sps-frontend-container
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - sps-express-server
    networks:
      - sps-group

networks:
  sps-group:
    driver: bridge

volumes:
  psql_data:
  backend_uploads:
